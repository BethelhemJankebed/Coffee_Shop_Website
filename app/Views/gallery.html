<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssinia Coffee | Member Gallery</title>
    <link rel="stylesheet" href="css/global.css" />
    <style>
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* UPLOAD BOX */
        .upload-card {
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px var(--shadow);
            margin-bottom: 50px;
            text-align: center;
            border: 1px solid var(--border);
        }

        input[type="text"], input[type="file"] {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: var(--text-main);
        }

        .btn-post {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .gallery-item {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow);
            transition: 0.3s;
            border: 1px solid var(--border);
        }

        .gallery-item:hover { transform: translateY(-8px); }

        .gallery-media {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .gallery-info {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .del-btn {
            background: #ffecf0;
            color: #d63031;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
      <div class="logo-row">
        <img src="img/coffeelogo.png" alt="Logo" class="logo-img" />
        <a class="brand-name" href="index.html">Abyssinia Coffee</a>
      </div>
      <nav class="nav-links" id="main-nav"></nav>
    </header>

    <div class="container">
        <div class="upload-card">
            <h3>Add to our Coffee Wall</h3>
            <p style="font-size: 0.8em; color: #d9a46d;">Upload Images, Audio (MP3), or Video (MP4)</p>
            <div class="upload-controls">
                <input type="file" id="media-file" accept="image/*,video/*,audio/*">
                <input type="text" id="media-title" placeholder="Enter a caption...">
                <button onclick="handleUpload()" class="btn-post">Upload & Post</button>
            </div>
        </div>

        <div id="gallery-grid" class="gallery-grid"></div>
    </div>

    <script src="js/ui_core.js"></script>
    <script src="js/nav.js"></script>
    <script>
const API_URL = "api.php?controller=gallery";

const getBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
});

async function fetchGallery() {
    const grid = document.getElementById('gallery-grid');
    const currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
    try {
        const res = await fetch(API_URL + "&action=list");
        const data = await res.json();
        const items = data.items || [];
        grid.innerHTML = "";

        if (items.length === 0) {
            grid.innerHTML = "<p style='text-align:center;'>No media yet. Be the first to upload!</p>";
            return;
        }

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'gallery-item';

            const url = item.image_url || item.url;
            const title = item.caption || item.title || "";

            let mediaTag = '';
            if (url.includes("data:video")) {
                mediaTag = `<video src="${url}" controls class="gallery-media"></video>`;
            } else if (url.includes("data:audio")) {
                mediaTag = `
                    <div class="audio-wrapper">
                        <span>ðŸŽµ Audio Note</span>
                        <audio src="${url}" controls></audio>
                    </div>`;
            } else {
                mediaTag = `<img src="${url}" class="gallery-media" onerror="this.src='img/coffeelogo.png'">`;
            }

            // Only show delete button if current user is an admin or the owner of this post
            const deleteBtn = (currentUser && (currentUser.role === 'admin' || currentUser.id == item.owner_user_id))
                ? `<button class="del-btn" onclick="deleteItem('${item.id}')">Delete</button>`
                : '';

            div.innerHTML = `
                ${mediaTag}
                <div class="gallery-info">
                    <span>${title}</span>
                    <span style="font-size:0.75rem;opacity:0.6;">${item.owner_username || ''}</span>
                    ${deleteBtn}
                </div>
            `;
            grid.appendChild(div);
        });
    } catch (err) {
        grid.innerHTML = "<p style='color:#ff6b6b;'>Server Error: Is database connected?</p>";
    }
}

async function handleUpload() {
    const currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
    if (!currentUser) {
        UI.popup('Authentication Required', 'Please sign in to upload to our Coffee Wall!', '⚠️');
        return;
    }

    const fileBox = document.getElementById('media-file');
    const titleBox = document.getElementById('media-title');
    const btn = document.querySelector('.btn-post');

    if (!fileBox.files[0] || !titleBox.value) {
        alert("Please select a file and write a caption!");
        return;
    }

    try {
        btn.innerText = "Uploading...";
        btn.disabled = true;
        const base64String = await getBase64(fileBox.files[0]);
        
        const newPost = {
            image_url: base64String,
            caption: titleBox.value,
            owner_user_id: currentUser.id,
            owner_username: currentUser.username
        };

        const response = await fetch(API_URL + "&action=add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newPost)
        });

        const result = await response.json();

        if (result.success) {
            titleBox.value = "";
            fileBox.value = "";
            fetchGallery();
        } else {
            alert("Upload failed: " + result.error);
        }
    } catch (err) {
        alert("Connection error.");
    } finally {
        btn.innerText = "Upload & Post";
        btn.disabled = false;
    }
}

async function deleteItem(id) {
    const currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
    if (!currentUser) {
        UI.popup('Authentication Required', 'Please sign in to delete gallery items.', '⚠️');
        return;
    }

    UI.confirm('Remove Gallery Item', 'Are you sure you want to delete this from the gallery?', async () => {
        try {
            const response = await fetch(API_URL + "&action=delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    id: id,
                    user_id: currentUser.id,
                    role: currentUser.role
                })
            });
            const result = await response.json();
            if (result.success) {
                fetchGallery();
                UI.toast('Gallery item removed successfully!', '✅');
            } else {
                UI.popup('Error', result.error || 'Could not delete the gallery item.', '❌');
            }
        } catch(e) {
            UI.popup('Error', 'Connection or server error.', '❌');
        }
    });
}

window.onload = fetchGallery;
    </script>
</body>
</html>
