<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Order History | Abyssinia Coffee</title>
    <link rel="icon" href="img/coffeelogo.png" />
    <link rel="stylesheet" href="css/global.css?v=201" />
    <style>
      :root {
        --primary: #2c1810;
        --accent: #f39c12;
        --cream: #fefaf7;
        --gold: #d4af37;
      }

      body {
        background-color: var(--cream);
        color: var(--primary);
        font-family: "Inter", sans-serif;
        margin: 0;
        padding-top: 80px;
      }

      /* Nav Consistency */
      header {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(44, 24, 16, 0.95);
        padding: 15px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        box-sizing: border-box;
      }
      .logo img {
        height: 50px;
      }
      .nav-links a {
        color: #fff;
        text-decoration: none;
        margin-left: 30px;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.3s;
      }
      .nav-links a:hover {
        color: var(--accent);
      }

      .portfolio-container {
        max-width: 1200px;
        margin: 60px auto;
        padding: 0 20px;
      }

      .section-header {
        border-bottom: 2px solid var(--primary);
        padding-bottom: 20px;
        margin-bottom: 40px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .section-header h1 {
        font-size: 2.5rem;
        margin: 0;
        font-family: "Unna", serif;
      }

      /* Cart Items */
      .cart-grid {
        display: grid;
        gap: 20px;
        margin-bottom: 40px;
      }

      .cart-item {
        background: #fff;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        border-radius: 8px;
      }

      .cart-info {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .cart-img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 4px;
      }

      .checkout-box {
        background: var(--primary);
        color: #fff;
        padding: 30px;
        border-radius: 12px;
        text-align: right;
        margin-bottom: 80px;
      }

      .btn-checkout {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 15px 40px;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        margin-top: 20px;
      }

      /* Order History */
      .history-card {
        background: #fff;
        border-left: 5px solid var(--accent);
        padding: 25px;
        margin-bottom: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .barcode {
        font-family: "Libre Barcode 39", cursive;
        font-size: 4rem;
        color: #333;
      }

      .review-btn {
        background: none;
        border: 1px solid var(--primary);
        padding: 8px 15px;
        cursor: pointer;
        transition: 0.3s;
      }
      .review-btn:hover {
        background: var(--primary);
        color: #fff;
      }

      #review-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 2000;
        place-items: center;
      }
      .modal-content {
        background: #fff;
        padding: 40px;
        width: 90%;
        max-width: 500px;
        border-radius: 10px;
      }
      textarea {
        width: 100%;
        height: 100px;
        margin: 15px 0;
        padding: 10px;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&family=Unna:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="img/coffeelogo.png" alt="Abyssinia Logo" />
      </div>
      <nav class="nav-links" id="main-nav">
        <a href="index.html">Home</a>
        <a href="shopnow.html">Shop</a>
        <a href="reserve.html">Reserve</a>
        <a href="gallery.html">Gallery</a>
        <a href="cart.html" style="color: var(--accent)">Cart</a>
      </nav>
    </header>

    <div class="portfolio-container">
      <div class="section-header">
        <div>
          <p
            style="
              text-transform: uppercase;
              letter-spacing: 2px;
              color: var(--accent);
              margin-bottom: 5px;
            "
          >
            Your Selection
          </p>
          <h1>Shopping Cart</h1>
        </div>
        <button
          onclick="localStorage.removeItem('cart'); location.reload();"
          style="
            background: none;
            border: none;
            text-decoration: underline;
            cursor: pointer;
          "
        >
          Clear All
        </button>
      </div>

      <div id="cart-items" class="cart-grid">
        <!-- Items injected here -->
      </div>

      <div class="checkout-box" id="checkout-summary">
        <h3>Total Amount: <span id="total-price">$0.00</span></h3>
        <button class="btn-checkout" onclick="openCheckoutModal()">
          Complete Transaction
        </button>
      </div>

      <div class="section-header" style="margin-top: 100px">
        <h1>Transaction History</h1>
      </div>

      <div id="order-history">
        <!-- History items injected here -->
      </div>
    </div>

    <div id="review-modal">
      <div class="modal-content">
        <h2>Leave a Review</h2>
        <p>Tell us about your experience</p>
        <div
          class="stars"
          style="
            font-size: 2rem;
            color: var(--accent);
            cursor: pointer;
            margin-top: 20px;
          "
        >
          <span onclick="setRating(1)">★</span>
          <span onclick="setRating(2)">★</span>
          <span onclick="setRating(3)">★</span>
          <span onclick="setRating(4)">★</span>
          <span onclick="setRating(5)">★</span>
        </div>
        <textarea
          id="review-comment"
          placeholder="Your feedback here..."
        ></textarea>
        <button
          class="btn-checkout"
          style="width: 100%"
          onclick="submitReview()"
        >
          Post Review
        </button>
        <button
          onclick="closeReview()"
          style="
            background: none;
            border: none;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
          "
        >
          Cancel
        </button>
      </div>
    </div>

    <!-- Receipt Modal -->
    <div
      id="receipt-modal"
      class="modal"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        z-index: 5000;
        place-items: center;
      "
    >
      <div
        class="modal-content"
        style="
          max-width: 400px;
          padding: 40px;
          border-top: 10px solid var(--accent);
          position: relative;
        "
      >
        <div style="text-align: center; margin-bottom: 20px">
          <img src="img/coffeelogo.png" height="50" />
          <h3
            style="
              margin-top: 10px;
              font-family: 'Unna', serif;
              font-size: 1.8rem;
            "
          >
            COFFEE RECEIPT
          </h3>
        </div>
        <div id="receipt-details" style="font-size: 0.9rem; line-height: 1.6">
          <!-- Injected via JS -->
        </div>
        <div style="text-align: center; margin-top: 30px">
          <div
            id="receipt-barcode"
            class="barcode"
            style="font-size: 3rem; margin-bottom: 10px"
          >
            00000000
          </div>
          <p style="font-size: 0.7rem; letter-spacing: 2px; opacity: 0.6">
            TRANSACTION VERIFIED
          </p>
        </div>
        <button
          class="btn-checkout"
          style="width: 100%; margin-top: 20px"
          onclick="location.reload()"
        >
          Done
        </button>
      </div>
    </div>

    <!-- Checkout Details Modal -->
    <div
      id="checkout-modal"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 4000;
        place-items: center;
        backdrop-filter: blur(4px);
      "
    >
      <div
        style="
          background: #fff;
          padding: 40px;
          width: 90%;
          max-width: 480px;
          border-radius: 4px;
          border-top: 5px solid var(--accent);
        "
      >
        <h2 style="font-family: 'Unna', serif; margin: 0 0 8px">
          Delivery Details
        </h2>
        <p style="color: #888; margin: 0 0 28px">
          Please confirm your contact information before we process your order.
        </p>

        <div style="margin-bottom: 16px">
          <label
            style="
              font-size: 0.78rem;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 1px;
              display: block;
              margin-bottom: 6px;
            "
            >Full Name</label
          >
          <input
            id="co-name"
            type="text"
            placeholder="Your full name"
            style="
              width: 100%;
              padding: 12px;
              border: 1px solid #ddd;
              border-radius: 4px;
              box-sizing: border-box;
              font-size: 0.95rem;
            "
          />
        </div>
        <div style="margin-bottom: 16px">
          <label
            style="
              font-size: 0.78rem;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 1px;
              display: block;
              margin-bottom: 6px;
            "
            >Phone Number</label
          >
          <input
            id="co-phone"
            type="tel"
            placeholder="+251 9XX XXX XXX"
            style="
              width: 100%;
              padding: 12px;
              border: 1px solid #ddd;
              border-radius: 4px;
              box-sizing: border-box;
              font-size: 0.95rem;
            "
          />
        </div>
        <div style="margin-bottom: 28px">
          <label
            style="
              font-size: 0.78rem;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 1px;
              display: block;
              margin-bottom: 6px;
            "
            >Delivery Address</label
          >
          <input
            id="co-address"
            type="text"
            placeholder="e.g. Bole, Addis Ababa"
            style="
              width: 100%;
              padding: 12px;
              border: 1px solid #ddd;
              border-radius: 4px;
              box-sizing: border-box;
              font-size: 0.95rem;
            "
          />
        </div>

        <div style="display: flex; gap: 12px">
          <button
            class="btn-checkout"
            style="flex: 1; padding: 14px"
            onclick="cartManager.checkout()"
          >
            Confirm & Pay
          </button>
          <button
            onclick="document.getElementById('checkout-modal').style.display='none'"
            style="
              flex: 1;
              padding: 14px;
              background: #eee;
              border: none;
              cursor: pointer;
              font-weight: 700;
            "
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script src="js/ui_core.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
