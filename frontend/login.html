<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Abyssinia Coffee</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: var(--bg-sub);
        }
        .login-card { 
            background: #fff; 
            padding: 50px 40px; 
            border-radius: 30px; 
            box-shadow: 0 15px 50px var(--shadow); 
            text-align: center; 
            width: 400px;
            border: 1px solid var(--border);
        }
        .login-card h2 {
            margin-bottom: 30px;
            color: var(--text-main);
            font-weight: 800;
        }
        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            background: var(--bg-main); 
            color: var(--text-main); 
            box-sizing: border-box; 
            font-size: 1rem;
        }
        .login-btn { 
            width: 100%; 
            padding: 15px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .login-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .back-home { margin-top: 20px; display: block; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="img/coffeelogo.png" alt="Logo" style="height: 80px; margin-bottom: 20px;">
        <h2>Welcome Back</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="login-btn" onclick="performLogin()">Sign In</button>
        <p id="error" style="color: #e74c3c; font-size: 14px; margin-top: 15px;"></p>
        <a href="index.html" class="back-home">← Back to Homepage</a>
    </div>

<script src="js/login.js" defer></script>
</body>
</html>
