<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserve | Abyssinia Coffee</title>
  <link rel="icon" href="img/coffeelogo.png" />
  <link rel="stylesheet" href="css/global.css?v=601" />
  <style>
    .reserve-hero {
      height: 400px;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('img/reservebackg.jpg') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Unna', serif;
      font-size: 3rem;
    }
    .reserve-box {
      max-width: 600px;
      margin: -100px auto 100px;
      background: #fff;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.1);
      position: relative;
      z-index: 10;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; }
    .form-row.full { grid-template-columns: 1fr; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
  </style>
</head>
<body>

  <header>
    <div class="logo-row">
      <img src="img/coffeelogo.png" alt="Logo">
      <a href="index.html" class="brand-name">Abyssinia Coffee</a>
    </div>
    <nav class="nav-links" id="main-nav">
      <a href="index.html">Home</a>
      <a href="shopnow.html">Shop</a>
      <a href="reserve.html" style="color:var(--accent)">Reserve</a>
      <a href="gallery.html">Gallery</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <div class="reserve-hero">Secure A Table</div>

  <section style="padding-top:0">
    <div class="reserve-box">
      <h2 style="margin-top:0">Private Reservation</h2>
      <p style="text-align:center; color:#666; margin-bottom:40px;">Experience the ritual of Ethiopian coffee in a setting of unmatched elegance.</p>
      
      <form onsubmit="alert('Reservation received. We will contact you shortly.'); return false;">
        <div class="form-row full" style="margin-bottom:20px;">
          <label>Full Name</label>
          <input type="text" placeholder="Your Name" required>
        </div>
        <div class="form-row" style="margin-bottom:20px;">
          <div>
            <label>Date</label>
            <input type="date" required>
          </div>
          <div>
            <label>Guests</label>
            <select>
              <option>1 Connoisseur</option>
              <option>2 People</option>
              <option>Private Party (4+)</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-boutique accent" style="width:100%">Confirm Reservation</button>
      </form>
    </div>
  </section>

  <footer class="standard-footer">
    <div class="footer-col">
        <h3>Quick Reservation</h3>
        <p>Book directly at our heritage location for the freshest grind.</p>
    </div>
    <div class="footer-bottom">&copy; 2024 Abyssinia Coffee Boutique.</div>
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem('currentUser'));
    if (user) {
        const nav = document.getElementById('main-nav');
        const logout = document.createElement('a');
        logout.href = "#";
        logout.innerHTML = `LOGOUT (${user.username})`;
        logout.onclick = () => { localStorage.clear(); location.reload(); };
        nav.appendChild(logout);
        if(user.role === 'admin') {
            const adminL = document.createElement('a');
            adminL.href = "Admin.html";
            adminL.innerText = "ADMIN";
            adminL.style.color = "var(--accent)";
            nav.appendChild(adminL);
        }
    }
  </script>
</body>
</html>
