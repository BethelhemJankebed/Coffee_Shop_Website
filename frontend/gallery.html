<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyssinia Coffee | Member Gallery</title>
    <link rel="stylesheet" href="css/global.css" />
    <style>
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      /* UPLOAD BOX */
      .upload-card {
        background: #fff;
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 10px 40px var(--shadow);
        margin-bottom: 50px;
        text-align: center;
        border: 1px solid var(--border);
      }

      input[type="text"],
      input[type="file"] {
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--bg-main);
        color: var(--text-main);
      }

      .btn-post {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
      }

      .gallery-item {
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 20px var(--shadow);
        transition: 0.3s;
        border: 1px solid var(--border);
      }

      .gallery-item:hover {
        transform: translateY(-8px);
      }

      .gallery-media {
        width: 100%;
        height: 250px;
        object-fit: cover;
      }

      .gallery-info {
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
      }

      .del-btn {
        background: #ffecf0;
        color: #d63031;
        border: none;
        padding: 8px 15px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .confirm-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 5000;
        place-items: center;
        padding: 20px;
      }

      .confirm-box {
        width: min(420px, 100%);
        background: #fff;
        border-radius: 22px;
        padding: 28px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      .confirm-box h3 {
        margin: 0 0 14px;
        color: var(--primary);
        font-family: "Unna", serif;
        font-size: 2rem;
      }

      .confirm-btns {
        display: flex;
        gap: 12px;
        margin-top: 22px;
      }

      .confirm-btns button {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-row">
        <img src="img/coffeelogo.png" alt="Logo" class="logo-img" />
        <a class="brand-name" href="index.html">Abyssinia Coffee</a>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shopnow.html">Shop</a>
        <a href="reserve.html">Reserve</a>
        <a href="gallery.html">Gallery</a>
      </nav>
    </header>

    <div class="container">
      <div class="upload-card">
        <h3>Add to our Coffee Wall</h3>
        <p style="font-size: 0.8em; color: #d9a46d">
          Upload Images, Audio (MP3), or Video (MP4)
        </p>
        <div class="upload-controls">
          <input type="file" id="media-file" accept="image/*,video/*,audio/*" />
          <input
            type="text"
            id="media-title"
            placeholder="Enter a caption..."
          />
          <button onclick="handleUpload()" class="btn-post">
            Upload & Post
          </button>
        </div>
      </div>

      <div id="gallery-grid" class="gallery-grid"></div>
    </div>

    <div id="confirm-overlay" class="confirm-overlay">
      <div class="confirm-box">
        <h3>Remove Item?</h3>
        <p
          id="confirm-message"
          style="margin: 0; color: #333; line-height: 1.6"
        >
          Delete this from the gallery?
        </p>
        <div class="confirm-btns">
          <button
            id="confirm-no"
            class="btn-post"
            style="background: #f2ebe4; color: var(--primary)"
          >
            Cancel
          </button>
          <button id="confirm-yes" class="del-btn" style="padding: 12px 20px">
            Yes, Delete
          </button>
        </div>
      </div>
    </div>

    <script src="js/alerts.js"></script>

    <script>
      const API_URL = "../backend/gallery.php";

      const getBase64 = (file) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result);
          reader.onerror = (error) => reject(error);
        });

      let pendingDeleteId = null;

      function openDeleteConfirm(id) {
        pendingDeleteId = id;
        document.getElementById("confirm-overlay").style.display = "grid";
      }

      function closeDeleteConfirm() {
        pendingDeleteId = null;
        document.getElementById("confirm-overlay").style.display = "none";
      }

      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("confirm-no")
          .addEventListener("click", closeDeleteConfirm);
        document
          .getElementById("confirm-yes")
          .addEventListener("click", async () => {
            if (!pendingDeleteId) return;

            try {
              await fetch(API_URL + "?action=delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: pendingDeleteId }),
              });
              closeDeleteConfirm();
              fetchGallery();
              alert("Post deleted successfully.");
            } catch (e) {
              alert("Error deleting item.");
            }
          });
      });

      async function fetchGallery() {
        const grid = document.getElementById("gallery-grid");
        try {
          const res = await fetch(API_URL + "?action=list");
          const data = await res.json();
          const items = data.items || [];
          grid.innerHTML = "";

          if (items.length === 0) {
            grid.innerHTML =
              "<p style='text-align:center;'>No media yet. Be the first to upload!</p>";
            return;
          }

          items.forEach((item) => {
            const div = document.createElement("div");
            div.className = "gallery-item";

            const url = item.image_url || item.url;
            const title = item.caption || item.title || "";

            let mediaTag = "";
            if (url.includes("data:video")) {
              mediaTag = `<video src="${url}" controls class="gallery-media"></video>`;
            } else if (url.includes("data:audio")) {
              mediaTag = `
                    <div class="audio-wrapper">
                        <span>ðŸŽµ Audio Note</span>
                        <audio src="${url}" controls></audio>
                    </div>`;
            } else {
              mediaTag = `<img src="${url}" class="gallery-media" onerror="this.src='img/coffeelogo.png'">`;
            }

            div.innerHTML = `
                ${mediaTag}
                <div class="gallery-info">
                    <span>${title}</span>
                    <button class="del-btn" onclick="openDeleteConfirm('${item.id}')">Delete</button>
                </div>
            `;
            grid.appendChild(div);
          });
        } catch (err) {
          grid.innerHTML =
            "<p style='color:#ff6b6b;'>Server Error: Is database connected?</p>";
        }
      }

      async function handleUpload() {
        const fileBox = document.getElementById("media-file");
        const titleBox = document.getElementById("media-title");
        const btn = document.querySelector(".btn-post");

        if (!fileBox.files[0] || !titleBox.value) {
          alert("Please select a file and write a caption!");
          return;
        }

        try {
          btn.innerText = "Uploading...";
          btn.disabled = true;
          const base64String = await getBase64(fileBox.files[0]);

          const newPost = {
            image_url: base64String,
            caption: titleBox.value,
          };

          const response = await fetch(API_URL + "?action=add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newPost),
          });

          const result = await response.json();

          if (result.success) {
            titleBox.value = "";
            fileBox.value = "";
            fetchGallery();
          } else {
            alert("Upload failed: " + result.error);
          }
        } catch (err) {
          alert("Connection error.");
        } finally {
          btn.innerText = "Upload & Post";
          btn.disabled = false;
        }
      }

      window.onload = fetchGallery;
    </script>
  </body>
</html>
