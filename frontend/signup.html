<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up - Abyssinia Coffee</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: var(--bg-sub);
        }
        .signup-box { 
            background: #fff; 
            padding: 50px 40px; 
            border-radius: 30px; 
            box-shadow: 0 15px 50px var(--shadow); 
            text-align: center; 
            width: 400px;
            border: 1px solid var(--border);
        }
        .signup-box h2 {
            margin-bottom: 30px;
            color: var(--text-main);
            font-weight: 800;
        }
        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            background: var(--bg-main); 
            color: var(--text-main); 
            box-sizing: border-box; 
            font-size: 1rem;
        }
        .btn { 
            width: 100%; 
            padding: 15px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .login-link { margin-top: 20px; display: block; color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="signup-box">
        <img src="img/coffeelogo.png" alt="Logo" style="height: 60px; margin-bottom: 20px;">
        <h2>Join the Club</h2>
        <input type="text" id="new-user" placeholder="Choose Username">
        <input type="password" id="new-pass" placeholder="Choose Password">
        <button class="btn" onclick="handleSignUp()">Create Account</button>
        <p id="msg" style="margin-top:15px; font-size: 14px; color: #2c1810;"></p>
        <a href="login.html" class="login-link">Already have an account? Sign In</a>
    </div>
<script src="js/signup.js" defer></script>
</body>
</html>
